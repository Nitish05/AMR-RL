# Editable source specification for the AMR-RL robot ("Pip").
# Regenerate simulator assets with:  scripts/amr.sh generate-robot
# All lengths in metres, masses in kilograms, angles in degrees.
# Values are design/simulation choices, NOT measurements of a physical robot.
name: amr_pip
chassis:
  length: 0.35          # x extent (front-back)
  width: 0.23           # y extent (body between the wheels)
  height: 0.10          # z extent
  ground_clearance: 0.03
  corner_radius: 0.045  # plan-view corner rounding
  edge_radius: 0.015    # vertical edge bevel
  axle_offset_x: 0.04   # drive axle is this far FORWARD of chassis centre
  mass: 4.0
  color: [0.93, 0.62, 0.20, 1.0]   # warm orange shell
drive:
  wheel_radius: 0.05
  wheel_width: 0.03
  track: 0.27           # wheel centre-to-centre distance
  wheel_mass: 0.3
  wheel_friction: 1.2
  max_wheel_speed: 12.0   # rad/s (0.6 m/s rim speed)
  max_wheel_torque: 1.5   # N m (simulated motor limit)
  velocity_gain: 4.0      # Genesis velocity-control gain (kv)
  tire_color: [0.08, 0.08, 0.09, 1.0]
  hub_color: [0.75, 0.76, 0.78, 1.0]
caster:
  type: ball            # passive ball-transfer support caster
  radius: 0.02
  inset_from_rear: 0.035
  mass: 0.08
  friction: 0.02
  color: [0.55, 0.56, 0.58, 1.0]
camera:
  # Front-facing RGB camera, rigidly mounted at the chassis nose. Part: Arducam
  # B0394 (Sony IMX219, low-distortion M12 lens; vendor FOV 88 D x 75 H x 60 V deg,
  # < 3 % distortion), 1640x1232 binned mode downscaled to 320x240 at 10 Hz. The
  # vendor's FOV and focal length disagree (2.8 mm gives ~67 x 53 deg): verify with
  # a checkerboard calibration before relying on the intrinsics below.
  part: Arducam B0394 (IMX219, 88 deg D low-distortion M12 lens)
  forward_from_axle: 0.125   # x offset of the optical centre from base_link
  height_above_ground: 0.155 # z of the optical centre above the floor (scale prior)
  pitch_down: 12.0
  vertical_fov: 60.0
  width: 320
  height: 240
  rate_hz: 10.0
  housing_color: [0.12, 0.13, 0.15, 1.0]
  lens_color: [0.05, 0.25, 0.45, 1.0]
screen:
  width: 0.16
  height: 0.11
  depth: 0.018
  mast_height: 0.10     # post from chassis top to the screen's lower edge
  back_from_axle: 0.075 # screen centre x offset behind base_link
  tilt_back: 10.0
  pixels: [192, 132]
  mass: 0.35
  bezel_color: [0.16, 0.17, 0.19, 1.0]
  display_color: [0.02, 0.03, 0.05, 1.0]
imu:
  # ST LSM6DSOX 6-axis MEMS IMU on the Adafruit breakout, product 4438
  # (STEMMA QT/Qwiic, I2C/SPI). Datasheet: ST DS12814 Rev 3 (Jan 2019), Table 2.
  # Datasheet values are "typ" (not guaranteed); the simulation draws each unit's
  # errors with sigma = the typ value and clips at 3x it (assumption). Items the
  # datasheet does not specify are marked ASSUMED.
  part: ST LSM6DSOX on Adafruit 4438 breakout
  unit_serial: 1                  # the simulated unit (fixes its sensitivity/cross-axis errors)
  mount_xyz: [-0.04, 0.0, 0.03]   # on base_link: chassis centre, on the chassis floor
  output_rate_hz: 104.0           # ODR 104 Hz (sampled at the 100 Hz physics step)
  bandwidth_hz: 33.0              # gyro LPF2 at ODR 104 Hz
  gyro:
    full_scale_dps: 250.0
    lsb_mdps: 8.75                # sensitivity at +-250 dps
    noise_density_dps_rthz: 0.0038  # high-performance mode
    offset_sigma_dps: 1.0         # zero-rate offset +-1 dps typ: fixed per unit
    offset_max_dps: 3.0
    offset_run_sigma_dps: 0.1     # ASSUMED: power-on to power-on repeatability (not published)
    # Rate random walk: not specified for the LSM6DSOX; Allan measurements of
    # comparable MEMS gyros (BMI160, TUM VI, Schubert et al. IROS 2018: 1.26e-4;
    # BMI055 in RealSense D435i, allan_variance_ros: 1.53e-4 dps/sqrt(s)). ANALOGUE.
    bias_random_walk_dps_rts: 0.00015
    # Warm-up: ZRO change vs temperature +-0.010 dps/degC typ (datasheet; sigma, sign
    # per unit) times the robot's electronics warming the IMU after power-on,
    # dT(t) = dT_max (1 - exp(-t / tau)). dT_max and tau: ASSUMED ranges bracketed by
    # hobby-robot and MEMS warm-up measurements (2-12 degC; 150-900 s); drawn per run.
    tempco_sigma_dps_per_c: 0.010
    warmup_dt_range_c: [2.0, 12.0]
    warmup_tau_range_s: [150.0, 900.0]
    sensitivity_sigma: 0.01       # sensitivity tolerance +-1 % typ
    sensitivity_max: 0.03
    cross_axis_sigma: 0.01        # ASSUMED (not specified)
  temperature:
    # On-chip temperature sensor (OUT_TEMP, 256 LSB/degC per the datasheet). Absolute
    # offset per unit and noise ASSUMED; the odometry uses only temperature changes.
    lsb_c: 0.00390625
    ambient_c: 22.0               # ASSUMED room temperature at power-on
    offset_sigma_c: 2.0           # ASSUMED
    noise_c: 0.05                 # ASSUMED
  accel:
    full_scale_g: 4.0
    lsb_mg: 0.122                 # sensitivity at +-4 g
    noise_density_ug_rthz: 75.0
    offset_sigma_mg: 20.0         # zero-g offset +-20 mg typ
    offset_max_mg: 60.0
    sensitivity_sigma: 0.01       # ASSUMED (not listed separately)
    sensitivity_max: 0.03
    cross_axis_sigma: 0.01        # ASSUMED
encoders:
  # Pololu item 4754: 70:1 Metal Gearmotor 37Dx70L mm 12V with 64 CPR Encoder
  # (Hall-effect quadrature on the motor shaft). Gear ratio exactly 70:1, so
  # 64 x 70 = 4480 counts per wheel revolution (1.40 mrad, 0.070 mm per count).
  part: Pololu 4754 (70:1 37D gearmotor, 64 CPR encoder)
  counts_per_wheel_rev: 4480
  backlash_deg: 1.0               # ASSUMED: Pololu gives no backlash figure
  sample_rate_hz: 100.0
