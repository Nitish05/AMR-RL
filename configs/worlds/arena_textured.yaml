# Textured learning arena (perception swap, step 5a; docs/results/textured-worlds.md):
# the arena layout and response rules with multi-hue patterned fixtures, patterned
# flags, colourful wall posters and one saturated distractor box. Fixtures stand
# >= 0.8 m from walls so that every interaction pose is observable and reachable. Consequence sets are
# supplied per experiment (configs/consequences/*.yaml); the defaults below are
# the "standard" set.
name: arena_textured
split: development
room: {size: [4.6, 3.8], wall_height: 1.0, wall_thickness: 0.1}
appearance: {floor: wood, floor_seed: 21, wall_seed: 22, palette: warm}
lighting:
  ambient: 0.32
  shadow: true
  directional:
    - {dir: [-0.4, -0.3, -1.0], color: [1.0, 0.97, 0.92], intensity: 3.0}
  points:
    - {pos: [0.0, 0.0, 2.4], color: [1.0, 0.95, 0.9], intensity: 2.0}
obstacles:
  - {name: crate_c, size: [0.40, 0.40, 0.35], pos: [0.0, 1.35], yaw: 0.15, texture_seed: 31}
  - {name: toybox, size: [0.25, 0.25, 0.22], pos: [-1.95, 1.55], yaw: 0.4, texture_seed: 61, style: saturated, base: orange, pattern: blobs}
posters:
  - {wall: wall_n, along: -1.0, z: 0.55, size: [0.7, 0.5], seed: 71}
  - {wall: wall_e, along: 0.6, z: 0.5, size: [0.6, 0.45], seed: 72}
  - {wall: wall_s, along: 0.9, z: 0.55, size: [0.6, 0.45], seed: 73}
  - {wall: wall_w, along: -0.9, z: 0.5, size: [0.5, 0.4], seed: 74}
fixtures:
  - {name: bloom, shape: cylinder, paint: cyan, size: [0.20, 0.20, 0.20], pos: [1.3, 0.75], texture: {seed: 41, style: stripes}, flag_seed: 51}
  - {name: grump, shape: box, paint: green, size: [0.22, 0.22, 0.20], pos: [-1.3, 0.8], texture: {seed: 42, style: checker}, flag_seed: 53}
  - {name: stone, shape: box, paint: blue, size: [0.20, 0.20, 0.20], pos: [1.25, -0.85], texture: {seed: 43, style: label}, flag_seed: 55}
  - {name: roller, shape: sphere, paint: magenta, size: [0.12, 0.12, 0.12], pos: [-1.2, -0.8], texture: {seed: 44, style: blobs}}
robot_start: [0.0, -0.1, 1.5708]
consequences:
  bloom: {signal: {response: yellow, p: 1.0, hold: 8.0}}
  grump: {nudge: {response: red, p: 1.0, hold: 8.0}, signal: {response: red, p: 1.0, hold: 8.0}}
  stone: {}
