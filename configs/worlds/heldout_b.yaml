# HELD-OUT layout B: different room geometry, obstacles, textures and lighting.
# Not used for tuning any parameter.
name: heldout_b
split: heldout_layout
room: {size: [5.4, 3.6], wall_height: 1.0, wall_thickness: 0.1}
appearance: {floor: tiles, floor_seed: 41, wall_seed: 42, palette: cool}
lighting:
  ambient: 0.28
  shadow: true
  directional:
    - {dir: [0.5, 0.2, -1.0], color: [0.95, 0.97, 1.0], intensity: 2.6}
  points:
    - {pos: [1.0, -0.5, 2.3], color: [1.0, 1.0, 1.0], intensity: 1.6}
obstacles:
  - {name: shelf, size: [1.40, 0.35, 0.60], pos: [-0.8, 1.2], yaw: 0.0, texture_seed: 61}
  - {name: crate_d, size: [0.40, 0.40, 0.40], pos: [1.2, -0.9], yaw: 0.4, texture_seed: 62}
  - {name: table_block, size: [0.60, 0.60, 0.40], pos: [1.4, 0.8], yaw: 0.0, texture_seed: 63}
  - {name: crate_e, size: [0.35, 0.35, 0.30], pos: [-1.6, -1.0], yaw: -0.2, texture_seed: 64}
fixtures:
  - {name: bloom, shape: cylinder, paint: cyan, size: [0.20, 0.20, 0.20], pos: [2.3, -1.3]}
  - {name: stone, shape: box, paint: blue, size: [0.20, 0.20, 0.20], pos: [-2.3, 0.2]}
robot_start: [-0.3, -0.6, 0.0]
consequences: {}
nav_eval:
  goals:
    - {name: centre, xy: [0.3, 0.3], expect: reach}
    - {name: west, xy: [-1.3, 0.1], expect: reach}
    - {name: south, xy: [0.5, -1.2], expect: reach}
    - {name: east, xy: [2.0, 0.0], expect: reach}
    - {name: inside_table, xy: [1.4, 0.8], expect: reject}
    - {name: outside_room, xy: [0.0, 2.5], expect: reject}
    - {name: inside_shelf, xy: [-0.8, 1.2], expect: reject}
  blackout: {from: centre, to: west, delay: 3.0, duration: 2.0}
  moved_obstacle: {size: [0.35, 0.35, 0.35], place: [-0.5, 0.2], from: centre, to: west}
