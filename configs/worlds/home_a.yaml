# Development layout A (used for tuning). Held-out layouts live in heldout_*.yaml.
name: home_a
split: development
room: {size: [5.0, 4.0], wall_height: 1.0, wall_thickness: 0.1}
appearance: {floor: wood, floor_seed: 1, wall_seed: 2, palette: warm}
lighting:
  ambient: 0.32
  shadow: true
  directional:
    - {dir: [-0.4, -0.3, -1.0], color: [1.0, 0.97, 0.92], intensity: 3.0}
  points:
    - {pos: [0.0, 0.0, 2.4], color: [1.0, 0.95, 0.9], intensity: 2.0}
obstacles:
  - {name: crate_a, size: [0.45, 0.40, 0.40], pos: [0.3, 1.35], yaw: 0.2, texture_seed: 11}
  - {name: crate_b, size: [0.40, 0.40, 0.30], pos: [-0.6, -1.4], yaw: -0.3, texture_seed: 12}
  - {name: bench, size: [1.10, 0.35, 0.35], pos: [1.6, -0.2], yaw: 1.5708, texture_seed: 13}
fixtures:
  - {name: bloom, shape: cylinder, paint: cyan, size: [0.20, 0.20, 0.20], pos: [2.05, 1.40]}
  - {name: grump, shape: box, paint: green, size: [0.22, 0.22, 0.20], pos: [-2.0, 1.45]}
  - {name: stone, shape: box, paint: blue, size: [0.20, 0.20, 0.20], pos: [2.05, -1.45]}
  - {name: roller, shape: sphere, paint: magenta, size: [0.12, 0.12, 0.12], pos: [-0.9, 0.45]}
robot_start: [-1.6, -0.6, 0.3]
# Engineered, world-side response rules (hidden from the robot).
consequences:
  bloom: {signal: {response: yellow, p: 1.0, hold: 8.0}}
  grump: {nudge: {response: red, p: 1.0, hold: 8.0}, signal: {response: red, p: 1.0, hold: 8.0}}
  stone: {}
nav_eval:
  # World-frame targets chosen by the evaluator/operator (the robot receives them
  # converted into its own map frame, as an operator clicking its map would).
  goals:
    - {name: open_centre, xy: [0.2, -0.4], expect: reach}
    - {name: crate_gap, xy: [0.9, 0.6], expect: reach}
    - {name: near_grump, xy: [-1.2, 0.9], expect: reach}
    - {name: south_east, xy: [1.0, -1.3], expect: reach}
    - {name: inside_crate, xy: [0.3, 1.35], expect: reject}
    - {name: outside_room, xy: [3.2, 0.0], expect: reject}
    - {name: inside_bench, xy: [1.6, -0.2], expect: reject}
  blackout: {from: open_centre, to: crate_gap, delay: 3.0, duration: 2.0}
  moved_obstacle: {size: [0.35, 0.35, 0.35], place: [0.55, 0.1], from: open_centre, to: crate_gap}
